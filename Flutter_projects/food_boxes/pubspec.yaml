name: food_boxes
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=2.18.6 <3.0.0'


dependencies:
  flutter:
    sdk: flutter
  table_calendar: 3.0.9
  cupertino_icons: ^1.0.2
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.2
  qr_flutter: ^4.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cloud_firestore: ^4.11.0
  flutter_riverpod: ^2.4.5
  riverpod_annotation: ^2.3.0
  intl: ^0.18.0
  uuid: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_lints: ^2.0.0
  riverpod_generator: ^2.3.5
  custom_lint: ^0.5.6
  riverpod_lint: ^2.3.3


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
      - family:  AppIcons
        fonts:
        - asset: assets/fonts/AppIcons.ttf
